<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Specialized Chatbot</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f7f7f8;
            margin: 0;
            min-height: 100vh;
        }
        #chat {
            max-width: 600px;
            margin: 40px auto 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 80vh;
            border: 1px solid #e0e0e0;
        }
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 24px 0 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .bubble {
            max-width: 80%;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.05em;
            line-height: 1.5;
            word-break: break-word;
            margin-bottom: 0;
        }
        .user {
            align-self: flex-end;
            background: #e3f2fd;
            color: #1565c0;
            border-bottom-right-radius: 4px;
            border: 1px solid #bbdefb;
        }
        .bot {
            align-self: flex-start;
            background: #f5f5f5;
            color: #222;
            border-bottom-left-radius: 4px;
            border: 1px solid #e0e0e0;
        }
        #chatForm {
            display: flex;
            gap: 8px;
            padding: 20px 24px;
            background: #fafafa;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            border-top: 1px solid #e0e0e0;
        }
        #question {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            font-size: 1em;
            background: #fff;
            color: #222;
        }
        #question:focus {
            outline: 2px solid #1976d2;
        }
        button[type="submit"] {
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 24px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
        }
        button[type="submit"]:hover {
            background: #1565c0;
        }
        .loading-dots {
            display: inline-block;
            width: 30px;
            height: 16px;
            vertical-align: middle;
        }
        .loading-dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            margin: 0 2px;
            background: #bdbdbd;
            border-radius: 50%;
            opacity: 0.6;
            animation: loading-bounce 1s infinite alternate;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes loading-bounce {
            0% { transform: translateY(0); opacity: 0.6; }
            50% { transform: translateY(-6px); opacity: 1; }
            100% { transform: translateY(0); opacity: 0.6; }
        }
        h2 {
            color: #1976d2;
            text-align: center;
            margin: 0;
            padding: 24px 0 0 0;
            font-weight: 600;
            letter-spacing: 1px;
        }
        /* Markdown styling for bot bubbles */
        .bot h1, .bot h2, .bot h3, .bot h4, .bot h5, .bot h6 {
            margin: 0.5em 0 0.2em 0;
            font-weight: bold;
        }
        .bot ul, .bot ol {
            margin: 0.5em 0 0.5em 1.5em;
        }
        .bot code {
            background: #f4f4f4;
            color: #c7254e;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.95em;
        }
        .bot pre {
        background: #f5f5f5;
        color: #222;
        padding: 18px 20px;
        border-radius: 8px;
        overflow-x: auto;
        font-size: 1.12em;           /* Larger font for verses */
        line-height: 1.7;            /* More readable line height */
        white-space: pre-wrap;        /* Allow wrapping, no horizontal scroll */
        word-break: break-word;
        margin: 0.5em 0;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .bot strong {
            font-weight: bold;
        }
        .bot em {
            font-style: italic;
        }
        .bot a {
            color: #1976d2;
            text-decoration: underline;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="chat">
        <h2>Specialized Chatbot</h2>
        <div id="messages"></div>
        <form id="chatForm" autocomplete="off">
            <input type="text" id="question" placeholder="Type your question..." required autocomplete="off">
            <button type="submit">Ask</button>
        </form>
    </div>
    <script>
        const form = document.getElementById('chatForm');
        const messages = document.getElementById('messages');
        const questionInput = document.getElementById('question');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = questionInput.value.trim();
            if (!question) return;

            // Show user question
            const userBubble = document.createElement('div');
            userBubble.className = 'bubble user';
            userBubble.textContent = question;
            messages.appendChild(userBubble);
            messages.scrollTop = messages.scrollHeight;

            // Clear input
            questionInput.value = '';

            // Show loading bubble with animated dots
            const loadingBubble = document.createElement('div');
            loadingBubble.className = 'bubble bot';
            loadingBubble.innerHTML = `<span class="loading-dots">
                <span></span><span></span><span></span>
            </span>`;
            messages.appendChild(loadingBubble);
            messages.scrollTop = messages.scrollHeight;

            // Call backend
            try {
                const res = await fetch('/v1/llm/answer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });
                const data = await res.json();

                // Replace loading with bot answer (rendered as Markdown)
                loadingBubble.innerHTML = marked.parse(data.answer || "Sorry, no answer.");
                messages.scrollTop = messages.scrollHeight;
            } catch (err) {
                loadingBubble.textContent = "Error contacting server.";
                messages.scrollTop = messages.scrollHeight;
            }
        });
    </script>
</body>
